[package]
name = "babelay"
version = "0.1.0"
description = "Babelay"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "babelay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Linux는 지원 밖 — 백엔드 feature 없이는 붙이지 않는다.
[target.'cfg(target_os = "macos")'.dependencies]
babelay-engine = { path = "../crates/babelay-engine", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
babelay-engine = { path = "../crates/babelay-engine", features = ["cuda"] }

[dev-dependencies]
tempfile = "3"

