[package]
name = "babelay-engine"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
cc = "1"

[dependencies]
# openmp 기본 feature 는 macOS clang 에서 빌드가 깨질 수 있어 끈다.
llama-cpp-2 = { version = "0.1.156", default-features = false, features = ["common"] }
encoding_rs = "0.8" # llama-cpp-2 token_to_piece 의 스트리밍 UTF-8 디코더
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.39"
thiserror = "2"
whisper-rs = "0.16"

[target.'cfg(target_os = "windows")'.dependencies]
nvml-wrapper = "0.13"
wasapi = "0.24"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[features]
metal = ["whisper-rs/metal", "llama-cpp-2/metal"]
cuda = ["whisper-rs/cuda", "llama-cpp-2/cuda"]
