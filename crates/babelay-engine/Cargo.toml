[package]
name = "babelay-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
sysinfo = "0.39"
thiserror = "2"
whisper-rs = "0.16"

[target.'cfg(target_os = "windows")'.dependencies]
nvml-wrapper = "0.13"
wasapi = "0.24"

[dev-dependencies]
serde_json = "1"
httpmock = "0.7"
tempfile = "3"

[features]
metal = ["whisper-rs/metal"]
cuda = ["whisper-rs/cuda"]
