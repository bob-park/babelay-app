[package]
name = "babelay-engine"
version = "0.1.0"
edition = "2021"

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
